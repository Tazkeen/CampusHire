name: Android CI

# Runs on every push and pull request: unit tests + debug APK build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is private, so it is NOT committed. Add it as a repo secret
      # named GOOGLE_SERVICES_JSON (base64 encoded). If the secret is missing we write a dummy
      # file so the project still compiles and the unit tests still run.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "1234567890", "project_id": "campushire-ci", "storage_bucket": "campushire-ci.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890", "android_client_info": { "package_name": "com.example.campushire" } },
              "api_key": [{ "current_key": "dummy-ci-key" }]
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campushire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

